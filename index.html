<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vazifalar Budilnigi — Mobil Simulyator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .animate-alarm-pulse {
            animation: pulse-ring 1.5s infinite ease-in-out;
        }
        .phone-frame {
            width: 390px;
            height: 780px;
            border-radius: 44px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.4), 0 0 0 12px #1f2937;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 font-sans text-slate-100">

    <!-- Telefon qolipi (Phone Frame) -->
    <div class="phone-frame bg-slate-950 relative overflow-hidden flex flex-col border border-slate-700">
        
        <!-- Status Bar -->
        <div class="h-10 px-7 pt-3 flex justify-between items-center text-xs text-slate-400 select-none z-20">
            <span id="current-clock" class="font-semibold text-slate-200">12:30</span>
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-clock text-indigo-400 text-[11px]"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full text-sm text-emerald-400"></i>
            </div>
        </div>

        <!-- 1. ASOSIY EKRAN (MAIN SCREEN) -->
        <div id="screen-main" class="flex-1 flex flex-col overflow-hidden">
            <!-- App Bar -->
            <div class="px-5 py-3 flex justify-between items-center border-b border-slate-800 bg-slate-900/80 backdrop-blur">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-600/30">
                        <i class="fa-solid fa-bell"></i>
                    </div>
                    <div>
                        <h1 class="text-base font-bold text-white leading-tight">Vazifalar Budilnigi</h1>
                        <p class="text-[11px] text-slate-400">Oflayn va aniq eslatmalar</p>
                    </div>
                </div>
                <button onclick="testTriggerAlarm()" title="Budilnikni darhol chalib ko'rish" class="px-2.5 py-1.5 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-lg text-xs font-medium flex items-center gap-1.5 hover:bg-amber-500/30 transition">
                    <i class="fa-solid fa-bolt text-[10px]"></i> Sinash
                </button>
            </div>

            <!-- Tablar: Bugungi, Kelgusi, Bajarilgan -->
            <div class="flex border-b border-slate-800 text-xs font-medium">
                <button onclick="switchTab('today')" id="tab-today" class="flex-1 py-3 text-center border-b-2 border-indigo-500 text-indigo-400 font-bold transition">Bugungi <span id="badge-today" class="ml-1 px-1.5 py-0.5 rounded-full bg-indigo-500/20 text-[10px]">2</span></button>
                <button onclick="switchTab('upcoming')" id="tab-upcoming" class="flex-1 py-3 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">Kelgusi <span id="badge-upcoming" class="ml-1 px-1.5 py-0.5 rounded-full bg-slate-800 text-[10px]">1</span></button>
                <button onclick="switchTab('completed')" id="tab-completed" class="flex-1 py-3 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">Bajarilgan <span id="badge-completed" class="ml-1 px-1.5 py-0.5 rounded-full bg-slate-800 text-[10px]">1</span></button>
            </div>

            <!-- Vazifalar ro'yxati -->
            <div id="task-list" class="flex-1 overflow-y-auto p-4 space-y-3 pb-20">
                <!-- Javascript orqali render bo'ladi -->
            </div>

            <!-- Yangi qo'shish tugmasi (FAB) -->
            <button onclick="openModal()" class="absolute bottom-6 right-6 w-14 h-14 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full flex items-center justify-center shadow-xl shadow-indigo-600/40 text-xl transition active:scale-95">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <!-- 2. BUDILNIK JIRINGLASH EKRANI (FULL-SCREEN ALARM) -->
        <div id="screen-alarm" class="hidden absolute inset-0 bg-gradient-to-b from-indigo-950 via-slate-950 to-black z-50 flex flex-col justify-between p-6 pt-14 text-center">
            <!-- Pulsatsiyali budilnik ikonasi -->
            <div>
                <div class="relative w-28 h-28 mx-auto flex items-center justify-center">
                    <div class="absolute inset-0 rounded-full bg-indigo-600/30 animate-alarm-pulse"></div>
                    <div class="w-20 h-20 bg-indigo-600 rounded-full flex items-center justify-center text-white text-3xl shadow-2xl shadow-indigo-500/50">
                        <i class="fa-solid fa-bell ring-bell"></i>
                    </div>
                </div>
                <div id="alarm-time-now" class="text-5xl font-black text-white mt-6 tracking-wider">07:00</div>
                <div class="text-xs uppercase tracking-widest text-indigo-400 font-semibold mt-1">Haqiqiy Budilnik Chalinmoqda</div>
            </div>

            <!-- Vazifa matni -->
            <div class="bg-white/10 backdrop-blur-md rounded-2xl p-5 border border-white/10 mx-2 shadow-xl">
                <div id="alarm-task-title" class="text-xl font-bold text-white mb-2">Ertalabki yugurish va mashq</div>
                <div id="alarm-task-desc" class="text-sm text-slate-300">Sport kiyimini kiyib parkka chiqish</div>
            </div>

            <!-- 3 ta boshqaruv tugmasi -->
            <div class="space-y-3">
                <button onclick="dismissAlarm(true)" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl font-bold text-base flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30 transition active:scale-98">
                    <i class="fa-solid fa-check"></i> Bajarildi
                </button>
                <button onclick="snoozeAlarm()" class="w-full py-3.5 bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/30 rounded-2xl font-semibold text-sm flex items-center justify-center gap-2 transition active:scale-98">
                    <i class="fa-solid fa-clock-rotate-left"></i> 5 daqiqaga kechiktirish (Snooze)
                </button>
                <button onclick="dismissAlarm(false)" class="w-full py-3 text-rose-400 hover:text-rose-300 font-medium text-sm transition">
                    Budilnikni o'chirish
                </button>
            </div>
        </div>

        <!-- 3. YANGI VAZIFA QO'SHISH MODALI -->
        <div id="modal-add" class="hidden absolute inset-0 bg-black/70 backdrop-blur-sm z-40 flex items-end">
            <div class="w-full bg-slate-900 border-t border-slate-700 rounded-t-3xl p-5 max-h-[90%] overflow-y-auto">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-base font-bold text-white">Yangi Vazifa Qo'shish</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                
                <div class="space-y-3 text-xs">
                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">Vazifa nomi *</label>
                        <input id="new-title" type="text" placeholder="Masalan: Dori ichish" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">Qisqa izoh</label>
                        <input id="new-desc" type="text" placeholder="Ixtiyoriy izoh..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500 text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-slate-400 mb-1 font-medium">Sana</label>
                            <input id="new-date" type="date" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500 text-xs">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1 font-medium">Budilnik Vaqti</label>
                            <input id="new-time" type="time" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500 text-xs">
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">Takrorlanish</label>
                        <select id="new-repeat" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-indigo-500 text-xs">
                            <option value="once">Bir martalik</option>
                            <option value="daily">Har kuni</option>
                            <option value="weekdays">Ish kunlari (Du–Ju)</option>
                        </select>
                    </div>
                    <div class="flex items-center justify-between pt-2">
                        <span class="text-slate-300 font-medium">Vibratsiya</span>
                        <input id="new-vibrate" type="checkbox" checked class="w-4 h-4 accent-indigo-600 rounded">
                    </div>

                    <button onclick="saveNewTask()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold text-sm mt-3 transition active:scale-98">
                        Saqlash va Budilnikni Yoqish
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Brauzerda ovoz sintezi uchun AudioContext -->
    <script>
        // Vaqtni yangilab turish
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('current-clock').textContent = `${h}:${m}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Namunaviy vazifalar (baza)
        let tasks = [
            {
                id: 1,
                title: "Muhim loyiha muhokamasi",
                desc: "Jamoa bilan Zoom orqali uchrashuv",
                time: "14:00",
                date: "2026-11-23",
                repeat: "once",
                enabled: true,
                completed: false
            },
            {
                id: 2,
                title: "Dori ichish",
                desc: "Ovqatdan keyin vitamin C",
                time: "18:30",
                date: "2026-11-23",
                repeat: "daily",
                enabled: true,
                completed: false
            },
            {
                id: 3,
                title: "Hisobot topshirish",
                desc: "Haftalik yakuniy hisobotni yuborish",
                time: "09:00",
                date: "2026-11-24",
                repeat: "weekdays",
                enabled: true,
                completed: false
            },
            {
                id: 4,
                title: "Kitob mutolaasi",
                desc: "Yangi bobni o'qib tugatish",
                time: "08:00",
                date: "2026-11-23",
                repeat: "daily",
                enabled: false,
                completed: true
            }
        ];

        let currentTab = 'today';

        function switchTab(tab) {
            currentTab = tab;
            ['today', 'upcoming', 'completed'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    el.classList.add('border-indigo-500', 'text-indigo-400', 'font-bold');
                    el.classList.remove('border-transparent', 'text-slate-400');
                } else {
                    el.classList.remove('border-indigo-500', 'text-indigo-400', 'font-bold');
                    el.classList.add('border-transparent', 'text-slate-400');
                }
            });
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';

            let filtered = [];
            const todayStr = new Date().toISOString().split('T')[0];

            if (currentTab === 'today') {
                filtered = tasks.filter(t => !t.completed && (t.date === todayStr || t.repeat === 'daily'));
            } else if (currentTab === 'upcoming') {
                filtered = tasks.filter(t => !t.completed && t.date > todayStr && t.repeat !== 'daily');
            } else {
                filtered = tasks.filter(t => t.completed);
            }

            // Badgelar
            document.getElementById('badge-today').textContent = tasks.filter(t => !t.completed && (t.date === todayStr || t.repeat === 'daily')).length;
            document.getElementById('badge-upcoming').textContent = tasks.filter(t => !t.completed && t.date > todayStr && t.repeat !== 'daily').length;
            document.getElementById('badge-completed').textContent = tasks.filter(t => t.completed).length;

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="h-64 flex flex-col items-center justify-center text-center p-6 text-slate-500">
                        <i class="fa-regular fa-calendar-check text-4xl mb-3 text-slate-600"></i>
                        <p class="text-xs">Ushbu bo'limda vazifalar mavjud emas</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(task => {
                const item = document.createElement('div');
                item.className = `p-3.5 rounded-2xl border transition ${task.completed ? 'bg-slate-900/40 border-slate-800 opacity-60' : 'bg-slate-900 border-slate-800 hover:border-slate-700'}`;
                
                const repeatBadge = task.repeat === 'daily' ? 'Har kuni' : task.repeat === 'weekdays' ? 'Du–Ju' : 'Bir martalik';

                item.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div class="flex items-start space-x-3 flex-1">
                            <button onclick="toggleComplete(${task.id})" class="mt-0.5 w-5 h-5 rounded-md border ${task.completed ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-slate-600 hover:border-indigo-500'} flex items-center justify-center text-[10px] transition">
                                ${task.completed ? '<i class="fa-solid fa-check"></i>' : ''}
                            </button>
                            <div class="flex-1">
                                <div class="flex items-center space-x-2">
                                    <span class="text-xl font-bold ${task.enabled && !task.completed ? 'text-indigo-400' : 'text-slate-400'}">${task.time}</span>
                                    <span class="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded">${repeatBadge}</span>
                                </div>
                                <h4 class="text-sm font-semibold text-white mt-0.5 ${task.completed ? 'line-through text-slate-500' : ''}">${task.title}</h4>
                                ${task.desc ? `<p class="text-xs text-slate-400 mt-0.5 line-clamp-1">${task.desc}</p>` : ''}
                            </div>
                        </div>
                        ${!task.completed ? `
                            <button onclick="toggleEnable(${task.id})" class="w-10 h-6 rounded-full transition p-0.5 flex items-center ${task.enabled ? 'bg-indigo-600 justify-end' : 'bg-slate-700 justify-start'}">
                                <span class="w-5 h-5 bg-white rounded-full shadow-md"></span>
                            </button>
                        ` : `
                            <button onclick="deleteTask(${task.id})" class="text-rose-400 hover:text-rose-300 p-1 text-xs">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        `}
                    </div>
                    <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-800/80 text-[11px] text-slate-400">
                        <span class="flex items-center gap-1 ${task.enabled && !task.completed ? 'text-amber-400' : ''}">
                            <i class="fa-regular fa-clock text-[10px]"></i>
                            ${task.completed ? 'Bajarilgan' : (task.enabled ? 'Budilnik faol' : "O'chirilgan")}
                        </span>
                        <button onclick="deleteTask(${task.id})" class="text-slate-500 hover:text-rose-400">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function toggleComplete(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                if (task.completed) task.enabled = false;
                renderTasks();
            }
        }

        function toggleEnable(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.enabled = !task.enabled;
                renderTasks();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
        }

        // Modal boshqaruvi
        function openModal() {
            const now = new Date();
            document.getElementById('new-date').value = now.toISOString().split('T')[0];
            now.setHours(now.getHours() + 1);
            document.getElementById('new-time').value = `${String(now.getHours()).padStart(2, '0')}:00`;
            document.getElementById('modal-add').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-add').classList.add('hidden');
        }

        function saveNewTask() {
            const title = document.getElementById('new-title').value.trim();
            if (!title) return alert("Iltimos, vazifa nomini kiriting!");

            const newTask = {
                id: Date.now(),
                title: title,
                desc: document.getElementById('new-desc').value.trim(),
                date: document.getElementById('new-date').value,
                time: document.getElementById('new-time').value,
                repeat: document.getElementById('new-repeat').value,
                enabled: true,
                completed: false
            };
            tasks.unshift(newTask);
            closeModal();
            renderTasks();
            document.getElementById('new-title').value = '';
            document.getElementById('new-desc').value = '';
        }

        // Budilnik ovozi (Web Audio API orqali chalinadi)
        let audioCtx = null;
        let alarmInterval = null;

        function startBeep() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            function beep() {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            }

            beep();
            alarmInterval = setInterval(beep, 600);
        }

        function stopBeep() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
        }

        // Budilnikni sinash oynasi
        function testTriggerAlarm() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('alarm-time-now').textContent = `${h}:${m}`;
            document.getElementById('alarm-task-title').textContent = "Muhim vazifa vaqti keldi!";
            document.getElementById('alarm-task-desc').textContent = "Ushbu vazifani hoziroq bajaring.";
            document.getElementById('screen-alarm').classList.remove('hidden');
            startBeep();
        }

        function dismissAlarm(completed) {
            stopBeep();
            document.getElementById('screen-alarm').classList.add('hidden');
            if (completed) {
                alert("Vazifa 'Bajarildi' deb belgilandi!");
            }
        }

        function snoozeAlarm() {
            stopBeep();
            document.getElementById('screen-alarm').classList.add('hidden');
            alert("Budilnik 5 daqiqaga kechiktirildi (Snooze rejalashtirildi).");
        }

        renderTasks();
    </script>
</body>
</html>
