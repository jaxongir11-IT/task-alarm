    <!-- 3. KATTA KOMPYUTER UCHUN BUDILNIK CHALINISH OYNASI (FULL-SCREEN ALARM MODAL) -->
    <div id="alarm-ring-overlay" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-gradient-to-b from-indigo-950 via-slate-900 to-slate-950 border border-indigo-500/40 rounded-3xl p-8 text-center shadow-2xl relative overflow-hidden">
            <!-- Pulsatsiya nuri (pointer-events-none qo'shildi) -->
            <div class="absolute -top-16 -left-16 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-16 -right-16 w-48 h-48 bg-amber-500/20 rounded-full blur-3xl pointer-events-none"></div>

            <div class="relative z-20">
                <!-- Budilnik animatsiyasi -->
                <div class="w-24 h-24 mx-auto rounded-3xl bg-indigo-600/30 border border-indigo-500/50 flex items-center justify-center text-white text-4xl shadow-xl shadow-indigo-600/40 animate-ring mb-4">
                    <i class="fa-solid fa-bell text-amber-400"></i>
                </div>

                <div id="ring-time" class="text-5xl font-black text-white tracking-widest font-mono">08:00</div>
                <div class="inline-block px-3 py-1 rounded-full bg-amber-500/20 text-amber-400 text-xs font-bold uppercase tracking-wider mt-2 border border-amber-500/30">
                    Budilnik Chalinmoqda!
                </div>

                <div class="my-6 p-5 rounded-2xl bg-slate-800/80 border border-slate-700">
                    <h3 id="ring-title" class="text-xl font-bold text-white">Muhim Vazifa</h3>
                    <p id="ring-desc" class="text-xs text-slate-300 mt-1">Ushbu vazifani belgilangan vaqtda bajaring.</p>
                </div>

                <!-- 3 ta boshqaruv tugmasi (barchasida aniq id va cursor-pointer) -->
                <div class="space-y-3 relative z-30">
                    <button type="button" id="btn-ring-complete" onclick="resolveAlarm(true)" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white rounded-xl font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30 transition cursor-pointer">
                        <i class="fa-solid fa-check"></i> Bajarildi deb belgilash
                    </button>
                    <button type="button" id="btn-ring-snooze" onclick="snoozeAlarm()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 active:bg-slate-900 text-amber-400 border border-amber-500/30 rounded-xl font-semibold text-xs flex items-center justify-center gap-2 transition cursor-pointer">
                        <i class="fa-solid fa-clock-rotate-left"></i> 5 daqiqaga kechiktirish (Snooze)
                    </button>
                    <button type="button" id="btn-ring-dismiss" onclick="resolveAlarm(false)" class="w-full py-2.5 text-rose-400 hover:text-rose-300 active:text-rose-500 font-medium text-xs transition cursor-pointer">
                        Budilnikni to'xtatish
                    </button>
                </div>
            </div>
        </div>
    </div>
