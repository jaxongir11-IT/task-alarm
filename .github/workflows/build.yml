name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build APK
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Rename APK
      run: cp app/build/outputs/apk/debug/app-debug.apk TaskAlarm.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TaskAlarm-apk
        path: TaskAlarm.apk

    - name: Release APK v2.0
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v2.0"
        name: "Vazifalar Budilnigi APK (v2.0)"
        body: "Yangilangan v2.0: Har kunlik va Tanlangan kunlar sahifalari, yangi HD logotip va yaxshilangan budilnik tizimi."
        files: TaskAlarm.apk
        overwrite_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
